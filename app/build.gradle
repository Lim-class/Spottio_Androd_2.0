plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.google.services)
}

android {
    namespace = 'com.example.spottio'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.spottio"
        minSdk 34
        targetSdk 34
        versionCode 1
        versionName "1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        resources {
            excludes += '/google/firestore/v1/query.proto'
            excludes += '/**/*.proto'
            excludes += '/META-INF/INDEX.LIST'
            excludes += '/META-INF/DEPENDENCIES'
        }
    }
}

dependencies {
    // AndroidX & UI
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    // KTX
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore

    // Servizi Google
    implementation libs.play.services.location

    // UI Utilities
    implementation libs.glide
    implementation libs.circleimageview
    implementation libs.zoomy

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation("io.coil-kt:coil-compose:2.4.0")

    // Jetpack Compose BoM
    def composeBom = platform('androidx.compose:compose-bom:2024.04.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Dipendenze Base per Compose
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Integrazione di Compose per Activity
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Icone estese per Compose (necessarie per Icons.Default.Group)
    implementation 'androidx.compose.material:material-icons-extended'

    // Integrazione Compose per ViewModel (potrebbe servirti in futuro)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
}