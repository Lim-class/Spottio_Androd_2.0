# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Abilitato il parallelismo per sfruttare tutti core della CPU
org.gradle.parallel=true

# Abilita la cache di configurazione e di build per rendere i successivi avvii fulminei
org.gradle.configuration-cache=true
org.gradle.caching=true

# Struttura dei pacchetti AndroidX obbligatoria
android.useAndroidX=true

# Ottimizzazione delle risorse R (riduce la dimensione finale dell'app)
android.nonTransitiveRClass=true

# Permette la compilazione temporanea se usi SDK recenti
android.suppressUnsupportedCompileSdk=35

# =====================================================================
# AGGIORNAMENTO AGP 9.x+: Attivazione dei sistemi moderni di build
# Rimossi i vecchi flag deprecati che mandavano in crash la build.
# =====================================================================
android.builtInKotlin=true
android.newDsl=true

# Spegne automaticamente il demone se inutilizzato per 5 minuti (300000 millisecondi)
org.gradle.daemon.idletimeout=300000